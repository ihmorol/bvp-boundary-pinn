[project]
name = "bvp-pinn"
version = "0.1.0"
description = "Classical reference and PINN for the five-field boundary value problem (Eqs. 14 to 19)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "sympy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bvp_pinn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# CPU build of PyTorch for laptops. On Colab the preinstalled PyTorch is used instead.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
